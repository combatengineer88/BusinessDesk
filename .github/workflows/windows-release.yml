name: Build BusinessDesk Windows Update

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: TDZIGNS_BusinessDesk_v2.7_Automated_Windows_Build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name TDZIGNS_BusinessDesk --collect-all reportlab --collect-all PIL --hidden-import excel_import --add-data "update_installer.ps1;." businessdesk.py
      - name: Package update ZIP
        shell: pwsh
        run: python package_release.py
      - name: Upload ready-to-install update
        uses: actions/upload-artifact@v4
        with:
          name: BusinessDesk-Windows-Update
          path: |
            TDZIGNS_BusinessDesk_v2.7_Automated_Windows_Build/TDZIGNS_BusinessDesk_*.zip
            TDZIGNS_BusinessDesk_v2.7_Automated_Windows_Build/TDZIGNS_BusinessDesk_*.sha256
            TDZIGNS_BusinessDesk_v2.7_Automated_Windows_Build/update_manifest.json
          if-no-files-found: error
      - name: Publish GitHub release when tagged
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" TDZIGNS_BusinessDesk_*.zip TDZIGNS_BusinessDesk_*.sha256 --title "BusinessDesk ${{ github.ref_name }}" --generate-notes
