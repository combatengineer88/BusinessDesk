name: Build and Publish BusinessDesk Updates

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: TDZIGNS_BusinessDesk_v2.7_Automated_Windows_Build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Validate tag and app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path "businessdesk.py" -Pattern "^VERSION = '([0-9.]+)'" ).Matches.Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match app version v$version" }
      - name: Validate updater PowerShell syntax
        shell: pwsh
        run: |
          foreach ($scriptName in @('update_installer.ps1','repair_from_github.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $scriptName).Path,[ref]$tokens,[ref]$parseErrors) | Out-Null
            if ($parseErrors -and $parseErrors.Count -gt 0) {
              foreach ($problem in $parseErrors) { Write-Error "$scriptName : $problem" }
              throw "PowerShell syntax failure in $scriptName"
            }
          }
      - name: Test supplier assignments and purchase orders
        shell: pwsh
        run: |
          python test_supplier_products.py
          python test_customer_pricing.py
          python test_invoice_fix.py
      - name: Build Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name TDZIGNS_BusinessDesk --collect-all reportlab --collect-all PIL --collect-all openpyxl --hidden-import excel_import --hidden-import supplier_catalog --add-data "update_installer.ps1;." launcher.py
      - name: Smoke-test compiled Windows EXE
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'BusinessDeskSmoke'
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null
          $exe = (Resolve-Path 'dist/TDZIGNS_BusinessDesk.exe').Path
          $proc = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Windows EXE smoke test exited with code $($proc.ExitCode)" }
      - name: Package release
        shell: pwsh
        run: python package_release.py
      - name: Verify updater can prepare published ZIP before app shutdown
        shell: pwsh
        run: |
          $version = (Select-String -Path 'businessdesk.py' -Pattern "^VERSION = '([0-9.]+)'").Matches.Groups[1].Value
          $zip = (Resolve-Path "TDZIGNS_BusinessDesk_$version.zip").Path
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          $data = Join-Path $env:RUNNER_TEMP 'BusinessDeskUpdatePreflight'
          $updates = Join-Path $data 'updates'
          New-Item -ItemType Directory -Path $updates -Force | Out-Null
          $handoff = Join-Path $updates ('handoff_' + [guid]::NewGuid().ToString('N') + '.ready')
          $target = Join-Path $data 'TDZIGNS_BusinessDesk.exe'
          # Run the Windows PowerShell installer in its own process because the
          # installer explicitly exits with a numeric status code.
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\update_installer.ps1 -Package $zip -Target $target -ProcessIdToWait 0 -DataDir $data -ExpectedSha256 $hash -Version $version -AllowFreshInstall -HandoffFile $handoff -PrepareOnly
          if ($LASTEXITCODE -ne 0) { throw "Installer preflight failed (exit code $LASTEXITCODE)." }
          if (-not (Test-Path -LiteralPath $handoff)) { throw 'Installer did not acknowledge update handoff.' }
          if ((Get-Content -LiteralPath $handoff -Raw).Trim() -ne 'PREPARED') { throw 'Incorrect installer handoff.' }
          Write-Host "Updater verified and prepared BusinessDesk v$version"
      - name: Upload installable build
        uses: actions/upload-artifact@v4
        with:
          name: BusinessDesk-Windows-Update
          path: |
            TDZIGNS_BusinessDesk_v2.7_Automated_Windows_Build/TDZIGNS_BusinessDesk_*.zip
            TDZIGNS_BusinessDesk_v2.7_Automated_Windows_Build/TDZIGNS_BusinessDesk_*.sha256
            TDZIGNS_BusinessDesk_v2.7_Automated_Windows_Build/update_manifest.json
          if-no-files-found: error
      - name: Publish stable release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path "businessdesk.py" -Pattern "^VERSION = '([0-9.]+)'" ).Matches.Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Incorrect version" }
          gh release create "${{ github.ref_name }}" "TDZIGNS_BusinessDesk_$version.zip" "TDZIGNS_BusinessDesk_$version.sha256" update_manifest.json --title "BusinessDesk v$version" --generate-notes --latest
